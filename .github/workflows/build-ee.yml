name: Build and Push Multiple EEs

on:
  push:
    branches:
      - main
    paths:
      - 'ee-*/**'
  workflow_dispatch:

jobs:
  # STEP 1: Detect which folders actually changed
  detect-changes:
    runs-on: [self-hosted]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Fetch history so we can compare commits

      - id: set-matrix
        name: Find changed EE directories
        run: |
          # Get list of changed files between current commit and previous commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Files changed: $CHANGED_FILES"
          
          # Extract the top-level directory names that start with 'ee-'
          DIRS=$(echo "$CHANGED_FILES" | grep '^ee-' | cut -d'/' -f1 | sort -u | jq -R -s -c 'split("\n")[:-1]')
          
          echo "Directories to build: $DIRS"
          echo "matrix=$DIRS" >> $GITHUB_OUTPUT

  # STEP 2: Build the changed EEs in parallel using a matrix
  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: [self-hosted, ansible-ee-runner]
    
    strategy:
      matrix:
        # Fixed: Changed "needs-changes" to "detect-changes"
        ee_dir: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ansible Builder
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ansible-builder
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Log in to Private Automation Hub Registry
        run: |
          podman login ${{ secrets.AUTOMATION_HUB_HOST }} \
            -u "${{ secrets.AUTOMATION_HUB_USERNAME }}" \
            -p "${{ secrets.AUTOMATION_HUB_PASSWORD }}"

      - name: Determine Image Name and Tag
        id: prep
        run: |
          IMAGE_NAME="${{ secrets.AUTOMATION_HUB_HOST }}/ee/${{ matrix.ee_dir }}"
          TAG="latest"
          echo "fullname=${IMAGE_NAME}:${TAG}" >> $GITHUB_OUTPUT

      # --- CRITICAL CHANGES: Injected Private Hub Variables into Environment ---
      # Added --container-runtime=podman to ensure it relies entirely on local execution
      - name: Build Execution Environment Context
        working-directory: ${{ matrix.ee_dir }}
        env:
          ANSIBLE_GALAXY_SERVER_LIST: automation_hub
          
          # 2. Define the URL and Token for the 'published' repo (for infra.* collections)
          ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_URL: https://${{ secrets.AUTOMATION_HUB_HOST }}/api/galaxy/content/validated/
          ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN: ${{ secrets.AUTOMATION_HUB_TOKEN }}
          
          # 3. Define the URL and Token for the 'rh-certified' repo (for ansible.controller, etc.)
         # ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_URL: https://${{ secrets.AUTOMATION_HUB_HOST }}/api/galaxy/content/rh-certified/
          #ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_CERTIFIED_TOKEN: ${{ secrets.AUTOMATION_HUB_TOKEN }}
          # Bypass cert validation during compilation if your Hub relies on a self-signed cert
          ANSIBLE_GALAXY_SERVER_VERIFY_SSL: "false"
        run: |
          ansible-builder build \
            --container-runtime=podman \
            --tag=${{ steps.prep.outputs.fullname }}
            --build-arg ANSIBLE_GALAXY_CLI_COLLECTION_OPTS="--pre" \
            --build-arg ANSIBLE_GALAXY_SERVER_LIST="automation_hub" \
            --build-arg ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_URL="https://${{ secrets.AUTOMATION_HUB_HOST }}/api/galaxy/content/validated/" \
            --build-arg ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_TOKEN="${{ secrets.AUTOMATION_HUB_TOKEN }}" \
            --build-arg ANSIBLE_GALAXY_SERVER_VERIFY_SSL="false"

      - name: Build EE Image with Podman
        working-directory: ${{ matrix.ee_dir }}
        run: |
          podman build -t ${{ steps.prep.outputs.fullname }} ./context

      - name: Push EE Image with Podman
        run: |
          podman push ${{ steps.prep.outputs.fullname }}
